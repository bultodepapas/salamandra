version: 2
updates:
  # Wiki (Astro Starlight) dependencies — keep the docs toolchain current.
  # Astro/Starlight move fast; weekly updates prevent ecosystem drift.
  - package-ecosystem: "npm"
    directory: "/wiki"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "wiki"

  # GitHub Actions — keep the deployment workflow current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
