name: Deploy wiki

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - 'README.md'
      - 'docs/**'
      - 'design/**'
      - 'decisions/**'
      - 'research/**'
      - 'gaps/**'
      - 'tests/**'
      - 'calculations/**'
      - 'geometry/**'
      - 'first_investigation.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'CLAUDE.md'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'wiki/**'
      - 'README.md'
      - 'docs/**'
      - 'design/**'
      - 'decisions/**'
      - 'research/**'
      - 'gaps/**'
      - 'tests/**'
      - 'calculations/**'
      - 'geometry/**'
      - 'first_investigation.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'CLAUDE.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # One deploy at a time on main; PRs run their own checks in parallel.
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install drawing dependencies
        run: python -m pip install --upgrade pip numpy

      - name: Check the generated drawing set and its published blocks
        run: python calculations/generate_blueprints.py --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wiki/package-lock.json

      - name: Install dependencies
        working-directory: wiki
        run: npm ci

      - name: Check referential integrity
        working-directory: wiki
        run: npm run check:refs

      - name: Lint wiki markdown
        working-directory: wiki
        run: npm run lint

      - name: Generate site content (strict) and build
        working-directory: wiki
        run: |
          node scripts/gen-site.mjs --strict
          npm run build

      - name: Check built navigation
        working-directory: wiki
        run: npm run check:site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: wiki/dist

  deploy:
    # Deploy only on pushes to main; PRs run the build and checks only.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
